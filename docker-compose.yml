services:
  api1:
    build:
      context: ./Backend
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in the root .env}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SERVICE_ROLE_KEY in the root .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    restart: unless-stopped
    networks:
      - app-network

  api2:
    build:
      context: ./Backend
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in the root .env}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SERVICE_ROLE_KEY in the root .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    restart: unless-stopped
    networks:
      - app-network

  api3:
    build:
      context: ./Backend
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in the root .env}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SERVICE_ROLE_KEY in the root .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
      - api3
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
